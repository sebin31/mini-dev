name: Deploy to EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Save current images for rollback
        run: |
          for svc in api frontend; do
            if docker image inspect mini-dev-$svc:latest >/dev/null 2>&1; then
              docker tag mini-dev-$svc:latest mini-dev-$svc:previous
              echo "Saved mini-dev-$svc as previous"
            fi
          done

      - name: Build and start containers
        run: docker compose up --build -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:8080/health; then
              echo "Deploy healthy"
              exit 0
            fi
            echo "Waiting for app ($i/12)..."
            sleep 5
          done
          echo "Health check failed"
          exit 1

      - name: Roll back on failure
        if: failure()
        run: |
          echo "Deploy failed, rolling back"
          for svc in api frontend; do
            if docker image inspect mini-dev-$svc:previous >/dev/null 2>&1; then
              docker tag mini-dev-$svc:previous mini-dev-$svc:latest
            fi
          done
          docker compose up -d --no-build
          echo "Rolled back to previous images"

      - name: Clean up old images
        if: success()
        run: docker image prune -f
