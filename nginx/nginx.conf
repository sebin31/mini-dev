server {
    listen 80;
    server_name _;

    # Route API calls to the .NET API container
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect bare /swagger straight to the working index page (preserve host:port)
    location = /swagger {
        return 301 $scheme://$http_host/swagger/index.html;
    }

    # Swagger UI, useful while learning/testing
    location /swagger/ {
        proxy_pass http://api:8080/swagger/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    # Everything else goes to the Angular frontend container
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
