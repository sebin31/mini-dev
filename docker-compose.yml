name: mini-dev
services:
  db:
    image: postgres:16-alpine
    container_name: minidev_db
    environment:
      POSTGRES_DB: MiniTwiseDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - mini_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MiniTwiseDb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
    container_name: minidev_api
    image: mini-dev-api
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=MiniTwiseDb;Username=postgres;Password=YourStrong!Passw0rd;"
    ports:
      - "9300:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mini_default

  frontend:
    build:
      context: ./frontend
    container_name: minidev_frontend
    image: mini-dev-frontend
    depends_on:
      - api
    networks:
      - mini_default

  nginx:
    image: nginx:1.27-alpine
    container_name: minidev_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
      - frontend
    networks:
      - mini_default

networks:
  mini_default:
    driver: bridge

volumes:
  pg_data:


