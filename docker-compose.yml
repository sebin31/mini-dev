services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: minitwise_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - mini_default
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Passw0rd\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  api:
    build:
      context: ./api
    container_name: minitwise_api
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=MiniTwiseDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False;"
    ports:
      - "9300:8080"   # external:internal, mirrors TWISE's ControlPlane API port style
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mini_default

  frontend:
    build:
      context: ./frontend
    container_name: minitwise_frontend
    depends_on:
      - api
    networks:
      - mini_default

  nginx:
    image: nginx:1.27-alpine
    container_name: minitwise_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"   # visit http://localhost:8080
    depends_on:
      - api
      - frontend
    networks:
      - mini_default

networks:
  mini_default:
    driver: bridge

volumes:
  mssql_data:
